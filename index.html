  { id: 'troisieme', t: 'Le 3e tour et le capitaine', d: 'Annoncer sa zone, passer ou conclure', cases: ['troisieme', 'capitaine'], html: `
<h3>L'ouvreur renseigne : sa zone</h3><p>Trois étapes : 1. <b>fit</b> ? (4 cartes dans la couleur du répondant) 2. <b>forme</b> ? (régulière → SA, couleur 6e → je la répète) 3. <b>zone</b> ? (après recomptage si fit).</p>${TBL(['Zone', 'Je fais'], ZONE_ROWS)}
<h3>Le capitaine décide : le feu tricolore</h3><p><b>Celui qui connaît le total décide.</b> Il additionne ses points avec le minimum <b>et</b> le maximum de son partenaire.</p>
${TBL(['Feu', 'Condition', 'Décision'], [['Rouge', 'même son maximum ne donne pas 25', 'passe'], ['Orange', 'seul son maximum donne 25', 'je propose'], ['Vert', 'même son minimum donne 25', 'je conclus']])}
<p>On ne passe <b>jamais</b> sur une enchère forcing. On ne relance <b>jamais</b> quand le total ne suffit pas.</p>
${KEEP('L\'ouvreur au 3e tour renseigne, il ne calcule pas le total. Le capitaine additionne et décide.')}` },
  { id: 'intervenir', t: 'Intervenir, contrer, cue-bid', d: 'Quand l\'adversaire a ouvert', cases: ['intervenir', 'contre', 'repcontre', 'cuebid'], html: `
<h3>Intervenir</h3>${TBL(['J\'annonce', 'Il me faut'], OVC_ROWS)}
<h3>Le contre d'appel : « partenaire, choisis ! »</h3><p>12 H et plus, court dans leur couleur, de quoi jouer dans les autres — surtout les majeures. Ou 18 H et plus, n'importe quelle main.</p>
<h3>Répondre au contre d'appel (obligatoire)</h3>${TBL(['Mes points', 'Je dis'], RC_ROWS)}
<h3>Le cue-bid</h3><p>Annoncer <b>leur</b> couleur = un code : <b>fit avec mon partenaire et 11 points ou plus</b>. On ne veut jamais jouer dans leur couleur.</p>
${KEEP('Palier 1 : 8 H et 5 belles cartes. Palier 2 : 11 H et 6 cartes. Sur un contre d\'appel : on répond toujours, majeure d\'abord.')}` },
  { id: 'chelem', t: 'Les chelems (FFB)', d: '33, 37, Blackwood 5 clés', cases: ['quanti', 'potentiel', 'bw', 'bwcap', 'dame', 'grand'], html: `
<h3>À Sans-Atout : on additionne</h3>${TBL(['Total HL', 'Je dis'], [['25 à 32', '3SA'], ['33 seulement face au maximum', '4SA quantitatif (proposition)'], ['33 à 36 sûr', '6SA'], ['37 seulement face au maximum', '5SA (proposition de grand chelem)'], ['37 sûr', '7SA']])}<p>Après une enchère à SA, 4SA n'est <b>jamais</b> un Blackwood.</p>
<h3>À la couleur : trois étapes</h3><p>1. <b>Fixer l'atout</b>. 2. Vérifier le <b>potentiel</b> (33 HLD) et les <b>contrôles</b> (As ou chicane), le moins cher d'abord. 3. Le <b>Blackwood 5 clés</b> (4 As + Roi d'atout).</p>
${TBL(['Clés', 'Réponse'], BW_ROWS)}
<p>Il faut <b>4 clés</b> et la Dame d'atout pour le petit chelem, <b>toutes</b> les clés, la Dame et les Rois pour le grand. Question à la Dame : la 1re enchère libre hors atout ; sans elle, l'enchère juste au-dessus. 5SA : les Rois (6♣ 0, 6♦ 1, 6♥ 2, 6♠ 3).</p>
${KEEP('33 → petit chelem, 37 → grand. Blackwood seulement quand le fit est fixé et les contrôles vérifiés.')}` },
  { id: 'entame', t: 'L\'entame', d: 'La première carte', cases: ['entsa', 'entcoul'], html: `
<p>Le joueur à <b>gauche du déclarant</b> entame, <b>avant</b> de voir le mort.</p>
<h3>Contre Sans-Atout : développer sa longue</h3><p>1. La couleur du partenaire s'il en a annoncé une. 2. Sinon ma couleur <b>la plus longue</b>. 3. La carte : <b>tête de séquence</b> (3 honneurs qui se suivent : R D V → le Roi), sinon la <b>4e meilleure</b> (R 9 7 4 2 → le 4).</p>
<h3>Contre une couleur : faire ses plis vite</h3><p>1. Un <b>singleton</b> (pour couper). 2. Une <b>tête de séquence</b> (2 honneurs qui se suivent). 3. La <b>couleur du partenaire</b>. 4. Sinon <b>l'atout</b> (« honneurs partout, entame atout »).</p>
<p><b>Jamais</b> une petite carte sous un As à la couleur. Dans la couleur du partenaire : l'As si je l'ai, la plus grosse d'un doubleton, la plus petite avec un honneur.</p>
${KEEP('SA : ma longue, tête de séquence ou 4e meilleure. Couleur : singleton, séquence, partenaire, atout.')}` },
  { id: 'jeu', t: 'Le jeu de la carte', d: 'Le plan du déclarant', cases: [], html: `
<h3>Avant de jouer la 1re carte du mort : un plan</h3>
<h3>À la couleur : compter les perdantes</h3><p>Comptez les perdantes de la <b>main longue en atout</b>, couleur par couleur. S'il y en a trop, la méthode <b>CDI</b> :</p>
${TBL(['Lettre', 'Technique'], [['C', 'Couper dans la main courte (le mort, en général)'], ['D', 'Défausser des perdantes sur des gagnantes de l\'autre main'], ['I', 'Impasser : jouer vers l\'honneur pour capturer celui de l\'adversaire']])}
<p>Faites tomber les atouts adverses <b>tôt</b>, sauf si vous avez besoin des atouts du mort pour couper.</p>
<h3>À Sans-Atout : compter les gagnantes</h3><p>Comptez les levées sûres. Il en manque ? Choisissez la couleur à <b>affranchir</b> (la plus longue). <b>Hold-up</b> : laissez passer l'entame adverse pour couper les communications. <b>Règle de 7</b> : 7 − (vos cartes dans la couleur entamée, à deux) = nombre de fois où vous laissez passer. Gardez des <b>reprises</b> (communications) vers la main qui a des levées.</p>
<h3>Impasse ou tirer en tête ?</h3><p>Pour la <b>Dame</b> : « <b>huit toujours, neuf jamais</b> » — avec 8 cartes à deux, faites l'impasse ; avec 9, tirez en tête. Pour le <b>Roi</b> : impasse jusqu'à 10 cartes, tirez en tête avec 11.</p>
<h3>Les chiffres à connaître : comment se répartissent les cartes adverses</h3>${TBL(['Ils ont…', 'Le plus probable', 'Ensuite', 'Le pire'], [['2 cartes', '1-1 (52 %)', '2-0 (48 %)', ''], ['3 cartes', '2-1 (78 %)', '3-0 (22 %)', ''], ['4 cartes', '3-1 (50 %)', '2-2 (40 %)', '4-0 (10 %)'], ['5 cartes', '3-2 (68 %)', '4-1 (28 %)', '5-0 (4 %)'], ['6 cartes', '4-2 (48 %)', '3-3 (36 %)', '5-1 (15 %)']])}
<p>Retenez la règle simple : <b>un nombre impair de cartes dehors se partage plutôt bien</b> (3-2, 2-1) ; <b>un nombre pair, plutôt mal</b> (4-2 plus souvent que 3-3, 3-1 plus souvent que 2-2). Avec 6 cartes dehors, ne comptez pas sur le 3-3 : c'est une chance sur trois.</p>
${KEEP('Couleur : compter les perdantes, puis CDI. SA : compter les gagnantes, affranchir, hold-up. Impair se partage bien, pair se partage mal.')}` },
  { id: 'comptage', t: 'Suivre les cartes pendant le jeu', d: 'Savoir ce qui est tombé et ce qui reste', cases: [], html: `
<p>Personne ne retient les 52 cartes, pas même les champions. Ils retiennent <b>peu de choses, mais toujours les mêmes, au même moment</b>. Voici la méthode, en 4 réflexes.</p>
<h3>Réflexe 1 — Avant de jouer : un nombre par couleur importante</h3><p>Quand le mort s'étale, additionnez vos cartes et celles du mort, puis faites <b>13 − ce total</b>. Vous avez 8 atouts → <b>ils en ont 5</b>. Dites-le-vous dans la tête : « cinq ». Faites de même pour votre couleur longue. <b>Deux couleurs suffisent</b> au début : les atouts, et la couleur que vous voulez affranchir.</p>
<h3>Réflexe 2 — À chaque pli : faire descendre le nombre</h3><p>Ne regardez que les <b>cartes des adversaires</b> (les vôtres, vous les voyez). Quand les deux fournissent : <b>moins 2</b>. « Cinq… trois… un. » Le rituel se fait <b>au moment où la 4e carte tombe</b>, avant de retourner le pli. Quand le nombre arrive à 0, plus besoin de jouer atout.</p>
<h3>Réflexe 3 — Guetter celui qui ne fournit plus</h3><p>Dès qu'un adversaire <b>défausse ou coupe</b>, notez-le : c'est la répartition complète de la couleur. Ils avaient 5 cœurs, Ouest défausse au 2e tour → Ouest en avait 1, <b>Est en avait 4</b>. C'est l'information la plus précieuse du jeu de la carte.</p>
<h3>Réflexe 4 — Ne retenir que les honneurs qui tombent</h3><p>Inutile de retenir les petites cartes. Dans chaque couleur, retenez seulement les <b>honneurs qui manquent</b> (« il me manque l'As et la Dame ») et rayez-les dans votre tête quand ils tombent. Tant que vous ne les avez pas vus tomber, <b>ils sont encore là</b> : votre Roi n'est pas maître.</p>
<h3>L'ordre de travail</h3>${TBL(['Moment', 'Je compte'], [['Le mort s\'étale', '13 − (moi + le mort) pour les atouts et ma couleur longue'], ['Chaque pli', 'les cartes adverses de ces couleurs : moins 2 quand les deux fournissent'], ['Une défausse', 'qui ne fournit plus → l\'autre a tout le reste'], ['Un honneur tombe', 'je le raye de ma liste des honneurs manquants'], ['Tous les 4 plis', 'je refais le point : atouts restants, levées faites, levées encore nécessaires']])}
<h3>Comment progresser, semaine après semaine</h3><ol><li><b>Semaine 1</b> : ne comptez que les atouts, à chaque donne.</li><li><b>Semaine 2</b> : les atouts + votre couleur longue.</li><li><b>Semaine 3</b> : ajoutez les honneurs manquants.</li><li><b>Ensuite</b> : les quatre couleurs, avec la règle des 13 (si je connais 3 couleurs d'un joueur, la 4e = 13 − le total).</li></ol>
<p><b>Deux aides en plus</b> : les enchères (1♥ adverse = 5 cœurs ; un barrage = 6 cartes) et les points (40 − les vôtres − ceux du mort = les leurs ; celui qui a passé n'a pas 12 H).</p>
${KEEP('Deux couleurs, un nombre chacune, que l\'on fait descendre au moment où la 4e carte tombe. Puis guetter la défausse et les honneurs.')}` },
  { id: 'flanc', t: 'La défense : faire chuter', d: 'Comprendre leurs annonces, compter, coopérer', cases: [], html: `
<p>Vous défendez <b>une donne sur deux</b>. Le déclarant voit ses 26 cartes ; vous ne voyez que les vôtres et le mort. Votre avantage : <b>les enchères</b> vous ont raconté sa main. Encore faut-il les avoir écoutées.</p>
<h3>Étape 1 — Traduire leurs annonces (pendant les enchères)</h3>${TBL(['Ils disent…', 'Ce que je note'], [['1♥ ou 1♠', '12 à 21 H, 5 cartes ou plus dans la couleur'], ['1SA', '15 à 17 H, main régulière (pas de singleton)'], ['1♦', '4 carreaux ou plus ; 1♣ : souvent seulement 2 ou 3 trèfles'], ['Soutien simple (1♥ – 2♥)', 'le répondant : 6 à 10 points, 3 cartes ou plus'], ['1SA en réponse', '6 à 10 H, pas de fit, pas de majeure 4e à montrer au palier 1'], ['Un barrage (2♠, 3♥…)', 'peu de points (6 à 10), une couleur de 6 ou 7 cartes'], ['Le Stayman puis 3SA', 'une majeure 4e chez le répondant, pas de fit trouvé'], ['Un partenaire qui passe', 'moins de 6 points, ou rien à dire : précieux aussi !']])}
<h3>Étape 2 — Le grand calcul (quand le mort s'étale)</h3><p><b>40 − mes H − les H du mort = les H du déclarant + ceux de mon partenaire.</b> Retirez les points annoncés par le déclarant : il reste <b>le maximum de mon partenaire</b>. Exemple : j'ai 9 H, le mort 12 H, le déclarant a ouvert 1SA (15-17) → mon partenaire a <b>au plus 4 H</b> (40 − 9 − 12 − 15).</p>
<h3>Étape 3 — Compter les levées de la défense</h3><p>Pour faire chuter, il faut <b>8 − le palier</b> levées : 4 contre une manche à 4♥, 3 contre 5♦, 6 contre 2♠. Avant chaque carte : « combien en ai-je ? d'où viendront les autres ? »</p>
<h3>Étape 4 — Compter les cartes (comme le déclarant, mais à l'envers)</h3><p>Vous voyez vos cartes et le mort : <b>13 − (moi + le mort)</b> = ce qu'ont le déclarant et votre partenaire. Retranchez à chaque pli. Dès que votre partenaire ne fournit plus, <b>le déclarant a tout le reste</b>. Et les enchères vous donnent souvent la longueur du déclarant dès le départ : 1♠ = 5 piques.</p>
<h3>Les règles de jeu en défense</h3>${TBL(['Règle', 'Pourquoi'], [['2e main basse', 'laisser le partenaire, placé derrière, prendre la décision'], ['3e main haute', 'forcer le déclarant à mettre un gros honneur (mais la plus petite de deux cartes qui se suivent : avec R D, la Dame)'], ['Couvrir un honneur par un honneur', 'pour promouvoir les cartes moyennes de votre camp'], ['Rejouer la couleur du partenaire', 'sauf bonne raison : c\'est souvent là que sont vos levées'], ['Contre une couleur avec un mort court', 'rejouer atout pour empêcher les coupes au mort'], ['Ne pas jouer dans « coupe et défausse »', 'jouer une couleur où le déclarant et le mort sont vides lui offre une levée']])}
<h3>Les signaux : parler avec ses cartes</h3><p>En signalisation classique, sur l'entame du partenaire : une <b>grosse carte</b> inutile = <b>j'aime</b>, continue (appel) ; une <b>petite</b> = <b>je n'aime pas</b> (refus). Pour le <b>compte</b> : grosse puis petite = un nombre <b>pair</b> de cartes ; petite puis grosse = <b>impair</b>. Vérifiez avec votre partenaire la signalisation de votre club.</p>
<p><b>La règle de 11</b> (sur une entame de 4e meilleure) : 11 − la carte entamée = le nombre de cartes plus hautes dans les trois autres mains. Le partenaire entame le 7 → 4 cartes plus hautes chez le mort, le déclarant et vous.</p>
${KEEP('Écouter leurs enchères, faire le grand calcul (40 − moi − le mort), viser 8 − le palier levées, compter leurs cartes, et parler à son partenaire avec ses signaux.')}` },
  { id: 'tournoi', t: 'Le tournoi duplicate', d: 'Comment il se déroule', cases: [], html: `
<p>Les donnes sont dans des <b>étuis</b> : après avoir joué, chacun remet ses 13 cartes dans sa case, et l'étui passe à la table suivante. Toutes les tables jouent donc <b>exactement les mêmes donnes</b>.</p>
<p>Les paires Nord-Sud restent en général à leur table, les paires Est-Ouest changent de table à chaque tour. On ne gagne pas en ayant de belles cartes, mais en faisant <b>mieux que les autres avec les mêmes cartes</b>.</p>
<p>Le résultat de chaque donne est un <b>pourcentage</b> (voir « La marque »). Un tournoi correct se situe autour de <b>50 %</b> ; au-dessus de <b>55 %</b>, c'est très bien ; au-dessus de <b>60 %</b>, on gagne souvent.</p>
${KEEP('Même donnes partout : on compare. 50 % = moyenne, 60 % = excellent.')}` },
  { id: 'excentriques', t: 'Les mains extraordinaires', d: 'Bicolores, chicanes, couleurs de 7 ou 8 cartes', cases: [], html: `
<p>Une fois de temps en temps, on ramasse une main « folle » : 6-5, 7-5, une chicane, 8 cartes dans une couleur. Ce sont des donnes où les <b>points d'honneur comptent moins que les longueurs</b>, et où une bonne enchère rapporte gros.</p>
<h3>1. Les bicolores à l'ouverture</h3>${TBL(['Forme', 'J\'ouvre', 'Ensuite'], [['5-5', 'la plus chère', 'je nomme l\'autre'], ['6-5', 'la 6e (la plus longue)', 'je nomme la 5e deux fois'], ['6-6', 'la plus chère', 'je nomme l\'autre deux fois'], ['7-5', 'la 7e', 'je nomme la 5e deux fois']])}
<p>Toujours avec <b>12 H</b> ou plus : la règle d'ouverture ne change pas. Ce qui change, c'est la suite : le partenaire doit pouvoir lire votre forme.</p>
<h3>2. Les couleurs très longues et faibles : le barrage</h3><p>6 à 10 H et une longue couleur avec deux honneurs : <b>la longueur fixe le palier</b>. 6 cartes = palier 2 (majeure), 7 cartes = palier 3, 8 cartes ou plus = palier 4. Pas de barrage avec deux couleurs : il faudrait de la place pour les montrer.</p>
<h3>3. Quand le fit est trouvé : la distribution explose</h3><p>Avec un fit, une chicane vaut 3, un singleton 2, un doubleton 1, et le répondant ajoute 1 par atout au-delà du 3e. Une main de 6 H peut ainsi valoir 13 points et la manche.</p>
<h3>4. Le misfit : la chicane devient un défaut</h3><p>Chicane dans la couleur du partenaire, pas de fit : <b>seulement les points d'honneur</b>, et on s'arrête dès que possible. Deux longues couleurs qui ne se rencontrent pas font très peu de levées.</p>
<h3>5. Chicane et chelem</h3><p>Avec une chicane, le Blackwood classique est piégé : il ne dit pas si l'As du partenaire est dans votre chicane (inutile) ou ailleurs. Passez d'abord par une mineure pour décrire, ou utilisez le Blackwood d'exclusion (chapitre Expert).</p>
<h3>6. Leur manche, notre sacrifice</h3><p>La <b>loi des levées</b> : avec 10 atouts à deux, on peut disputer au palier 4 ; avec 11, au palier 5. Non vulnérable contre vulnérables, 3 de chute contrés (−500) coûtent moins que leur manche (−620).</p>
<h3>7. Compter les levées plutôt que les points</h3><p>Une main de 10 H avec 9 piques maîtres fait 9 levées seule. Devant une main excentrique, demandez-vous : <b>combien de levées</b> ma main fait-elle si la couleur longue est atout ?</p>
${KEEP('Main folle : les longueurs avant les honneurs. Bicolore : on montre les deux couleurs. Fit : la distribution compte. Misfit : seulement les H, et on freine.')}` },
  { id: 'conventions', t: 'Expert : les conventions des bons joueurs', d: 'Ce que jouent les très bons joueurs, en 5e majeure', cases: [], html: `
<p>Ce chapitre est pour <b>plus tard</b>, quand le système de base est solide. Ces conventions sont jouées aujourd'hui par les compétiteurs et les très bons joueurs, en majeure cinquième. <b>Règle d'or : une convention ne s'utilise qu'après accord avec son partenaire.</b> Une convention mal comprise coûte plus cher qu'aucune convention.</p>
<h3>Pour soutenir le partenaire</h3>
<p><b>Splinter</b> — 1♠ – 4♥ (double saut dans une nouvelle couleur) : fit de 4 cartes, singleton ou chicane dans la couleur nommée, valeurs de manche. Le partenaire sait si ses honneurs dans cette couleur sont gaspillés.</p>
<p><b>2SA Jacoby</b> — 1♥ – 2SA : fit de 4 cartes, forcing de manche. L'ouvreur se décrit : nouvelle couleur au palier 3 = court ; 3 de la majeure = main forte ; 4 de la majeure = minimum.</p>
<p><b>2SA Truscott</b> — 1♠ – (contre) – 2SA : fit de 4 cartes, 10 points ou plus. Le surcontre montre 10+ sans fit ; 3♠ devient un barrage.</p>
<p><b>Drury</b> — main qui a passé : 1♠ (3e ou 4e position) – 2♣ = fit de 3+, 10-11 points. Protège contre les ouvertures légères en 3e position.</p>
<h3>Après une intervention adverse</h3>
<p><b>Contre Spoutnik</b> (contre négatif) — 1♦ – (1♠) – contre : 4 cœurs, sans la force de dire 2♥.</p>
<p><b>Contre de soutien</b> — 1♣ – 1♥ – (1♠) – contre : exactement 3 cœurs ; 2♥ en promet 4.</p>
<p><b>Lebensohl</b> — 1SA – (2♠) – 2SA : oblige l'ouvreur à dire 3♣ ; on passe ou on corrige avec une main faible. Une couleur dite directement au palier 3 est forçante.</p>
<h3>Pour décrire sa main</h3>
<p><b>Quatrième couleur forcing</b> — 1♦ – 1♥ – 1♠ – 2♣ : la 4e couleur est conventionnelle et forcing (« décris-toi »), elle ne promet pas la couleur.</p>
<p><b>Roudi</b> — 1♣ – 1♠ – 1SA – 2♣ : relais (11 points et plus) qui demande 3 cartes dans la majeure. 2♦ = non ; 2♠ = 3 cartes minimum ; 3♠ = 3 cartes maximum.</p>
<h3>Autour du Sans-Atout</h3>
<p><b>Smolen</b> — 1SA – 2♣ – 2♦ – 3♥ : 4 cœurs et 5 piques (on nomme la 4e pour montrer la 5e de l'autre), forcing de manche. L'ouvreur joue le contrat en majeure.</p>
<p><b>Texas sud-africain</b> — 1SA – 4♣ = « dis 4♥ » ; 4♦ = « dis 4♠ ». Pour jouer la manche en majeure 6e par la main forte.</p>
<p><b>Puppet Stayman</b> — 2SA – 3♣ : trouve les fits 5-3 et 4-4. 3♥/3♠ = 5 cartes ; 3♦ = au moins une majeure 4e ; 3SA = aucune.</p>
<h3>En intervention</h3>
<p><b>Landy</b> — (1SA) – 2♣ : les deux majeures, au moins 5-4.</p>
<p><b>Cue-bid Michaels</b> — (1♥) – 2♥ : 5 piques et une mineure 5e ; (1♣) – 2♣ : les deux majeures 5-5. À ne pas confondre avec le cue-bid du répondant de votre système.</p>
<p><b>2SA Unusual</b> — (1♠) – 2SA : les deux couleurs les moins chères non nommées (ici ♣ et ♦), au moins 5-5.</p>
<h3>Pour les chelems</h3>
<p><b>Blackwood d'exclusion</b> — un saut à 5 dans la couleur de sa <b>chicane</b> demande les clés hors de cette couleur. Réponses par paliers : 0, 1, 2 sans la Dame, 2 avec la Dame.</p>
${KEEP('Une convention à la fois, toujours d\'accord avec le partenaire. Les plus utiles d\'abord : Spoutnik, 4e couleur forcing, Roudi, Texas sud-africain, Splinter.')}` },
  { id: 'imp', t: 'Jouer en IMP (Funbridge, matchs par quatre)', d: 'Une autre façon de compter, une autre stratégie', cases: [], html: `
<p>Sur <b>Funbridge</b> (tournois d'entraînement et souvent les tournois du jour) et dans les <b>matchs par quatre</b>, on ne compte pas en pourcentage mais en <b>IMP</b> (International Match Points). Sur Funbridge, votre score est comparé à la <b>moyenne</b> de tous ceux qui ont joué la donne, puis l'écart est converti en IMP avec ce barème :</p>
${TBL(['Écart de points', 'IMP'], IMP_TABLE_ROWS)}
<h3>Ce qui change tout</h3><p>Le barème « écrase » les petites différences et garde les grosses. Une <b>levée de mieux</b> (+30) rapporte <b>1 IMP</b>. Une <b>manche vulnérable</b> ratée (environ 600 points d'écart) coûte <b>12 IMP</b>. Un total négatif veut simplement dire « un peu moins bien que la moyenne » : sur Funbridge, la moyenne est assez forte.</p>
${TBL(['Situation', 'Au pourcentage (club)', 'En IMP (Funbridge)'], [['Levée de mieux', 'précieuse', 'presque rien (1 IMP)'], ['Manche vulnérable douteuse', 'on suit la salle', 'on la déclare dès environ 1 chance sur 3'], ['Manche non vulnérable', 'on suit la salle', 'à partir d\'environ 1 chance sur 2'], ['Petit chelem', 'on suit la salle', 'dès qu\'il réussit plus d\'une fois sur 2'], ['Grand chelem', 'rarement', 'seulement s\'il est presque sûr'], ['3SA ou 4♥ (10 points d\'écart)', 'important', 'sans importance'], ['Contrer une partielle', 'souvent rentable', 'risqué : petit gain, grosse perte'], ['Jeu de la carte', 'viser la levée de plus', 'assurer le contrat d\'abord']])}
<h3>Les six règles de l'IMP</h3><ol><li><b>Audace pour les manches vulnérables.</b> Avec 24 points et un fit, on la dit.</li><li><b>Sécurité au jeu de la carte</b> : on joue pour réussir, pas pour la levée de mieux.</li><li><b>En défense, on fait chuter</b> : on ne prend pas de risque pour empêcher une levée de mieux.</li><li><b>Les partielles comptent peu</b> : pas de bataille acharnée pour 2♥ contre 2♠.</li><li><b>Chelems</b> : petit chelem à 50 %, grand chelem quasi sûr. En cas de doute, le petit.</li><li><b>Pas de contre « pour voir »</b> sur une partielle : contré, 2♥ qui réussit vaut la manche.</li></ol>
<p class="small">Sur Funbridge, une donne non jouée compte −6 IMP : terminez vos tournois !</p>
${KEEP('En IMP, on compare ce qu\'on peut gagner et ce qu\'on risque. Les petites différences ne comptent presque pas, les grosses comptent énormément.')}` },
  { id: 'duplicate', t: 'Être un peu meilleur que les autres en duplicate', d: 'La stratégie du tournoi, pour joueurs confirmés', cases: [], html: `
<p>En duplicate, on ne joue pas contre les cartes : on joue contre <b>les autres tables</b>. Une donne gagnée de 10 points vaut autant qu'une donne gagnée de 1 000. Toute la stratégie découle de cette idée : <b>la fréquence compte, pas l'ampleur</b>.</p>
<h3>1. Chaque dizaine compte</h3><p>3SA +1 (430) bat 4♥ = (420). 1SA +1 (120) bat 2♥ +1 (110). En partielle comme en manche, <b>Sans-Atout et majeures</b> rapportent plus que les mineures : avec un fit mineur et des arrêts partout, préférez 3SA à 5♣. Et une levée de mieux au jeu de la carte, c'est souvent 20 % de mieux.</p>
<h3>2. Ne jamais laisser jouer les adversaires au palier de 2 avec un fit</h3><p>Quand les deux camps ont un fit et à peu près la moitié des points, la donne se joue au palier de 2 ou de 3. <b>Celui qui se laisse faire perd</b>. La loi des levées guide : avec 9 atouts à deux, on peut disputer jusqu'au palier de 3.</p>
<h3>3. Le « 200 magique »</h3><p>Chuter de 2 contrés non vulnérable (−300) bat la manche adverse (−420) ; chuter de 1 (−100 ou −200) bat leur partielle à 110 ou 140. À l'inverse, contrer leur partielle quand on sent la chute peut rapporter <b>+200</b>, plus que n'importe quelle partielle à nous. C'est la marque qui décide, pas l'orgueil.</p>
<h3>4. Jouer avec la salle… ou contre elle</h3><p>Demandez-vous : <b>« Que feront les autres tables ? »</b> Si vous êtes dans le contrat normal, jouez la ligne normale : vous aurez au moins la moyenne. Si vous êtes dans un contrat meilleur ou pire que la salle, adaptez le risque : <b>pire</b>, il faut un coup qui gagne ; <b>meilleur</b>, assurez simplement.</p>
<h3>5. Les levées de mieux valent de l'or</h3><p>En match par quatre, on joue pour assurer le contrat. En duplicate par paires, on joue souvent pour <b>une levée de plus</b>, sauf si le contrat lui-même est rare ou risqué. En défense, la même logique : <b>encaisser</b> ses levées quand le déclarant menace de défausser, plutôt que d'espérer une chute improbable.</p>
<h3>6. Le réveil (en 4e position)</h3><p>1♥ – passe – passe – ? : si vous passez, ils jouent 1♥ ; or votre partenaire a sûrement des points. Avec 8-9 H et une couleur, <b>réveillez</b>. Les paires qui gagnent ne laissent pas jouer les adversaires à bas palier.</p>
<h3>7. L'entame à Sans-Atout en tournoi</h3><p>Contre 1SA–3SA, l'entame agressive (4e meilleure de votre longue) reste la règle. Mais quand l'adversaire a montré des forces partout, une entame <b>passive</b> qui ne donne rien rapporte souvent davantage : en duplicate, éviter le cadeau est déjà un bon résultat.</p>
<h3>8. Les petites habitudes qui font la différence</h3><ul><li><b>Une seule erreur par tournoi</b> de moins = environ 3 % de mieux.</li><li><b>Pas de coup d'éclat</b> sans raison : les tops viennent surtout des erreurs adverses.</li><li><b>Oublier la donne précédente</b>, bonne ou mauvaise.</li><li><b>Revoir ses donnes</b> après le tournoi avec les résultats des autres tables.</li></ul>
${TBL(['Situation', 'Le réflexe de tournoi'], [['Fit mineur, arrêts partout', '3SA plutôt que 5 en mineure'], ['Deux camps fittés, points partagés', 'disputer jusqu\'au palier (atouts − 6)'], ['Ils jouent une partielle, on sent la chute', 'contrer : +200 bat toutes nos partielles'], ['Contrat normal', 'ligne de jeu normale'], ['Contrat inférieur à la salle', 'chercher le coup qui gagne'], ['1♥ – passe – passe – ?', 'réveiller avec 8-9 H et une couleur']])}
${KEEP('En duplicate, on joue contre la salle : chaque dizaine compte, on ne laisse jamais jouer les adversaires bas avec un fit, et on se demande toujours ce que feront les autres tables.')}` },
  { id: 'champion', t: 'Du bon joueur au champion', d: 'Ce qui fait vraiment la différence', cases: [], html: `
<p>Un bon joueur et un champion connaissent souvent les <b>mêmes conventions</b>. La différence n'est pas dans le système : elle est dans <b>la méthode, la constance et le jugement</b>.</p>
${TBL(['', 'Le bon joueur', 'Le champion'], [
 ['Compter', 'compte ses points et les atouts', 'compte les <b>4 couleurs</b> et les points de chaque adversaire ; à mi-donne, il connaît leurs mains'],
 ['Avant le 1er pli', 'joue vite la première carte du mort', 'fait un <b>plan complet</b> : levées sûres, levées à créer, communications, danger'],
 ['Les enchères', 'applique le système', 'juge la main au-delà des points : honneurs dans les longues, 10 et 9, fit ou misfit, vulnérabilité'],
 ['Les déductions', 'voit ce qui a été dit', 'tire aussi parti de ce qui <b>n\'a pas</b> été dit : un adversaire qui a passé n\'a pas 12 H, l\'entame dit ce que l\'entameur n\'a pas'],
 ['La technique', 'connaît l\'impasse', 'reconnaît les jeux de sécurité, l\'élimination, le squeeze, et sait quand tirer plutôt que faire l\'impasse'],
 ['Le flanc', 'joue ses cartes', 'défend <b>à deux</b> : signaux d\'appel, de compte et de préférence, et il compte les levées de la défense'],
 ['Le duplicate', 'cherche le meilleur contrat', 'se demande « que feront les autres tables ? » et prend un risque seulement quand il le faut'],
 ['Le mental', 'est déstabilisé par une mauvaise donne', 'oublie la donne précédente : chaque donne est un nouveau match'],
])}
<h3>Ce que cela donne en tournoi</h3>${TBL(['Niveau', 'Résultat habituel en club'], [['Débutant', '35 à 45 %'], ['Intermédiaire', '45 à 52 %'], ['Très bon joueur', '55 à 60 %'], ['Champion international', 'plus de 60 %, très régulièrement']])}
<p>Le plus frappant chez un champion : il fait <b>très peu d'erreurs</b>, et presque jamais deux fois la même. Ce n'est pas qu'il trouve des coups géniaux. C'est qu'il ne donne rien.</p>
<h3>Les trois habitudes qui font monter d'un niveau</h3><ol><li><b>Compter à chaque donne</b>, même quand c'est facile (rubrique 2).</li><li><b>Une pause avant la première carte du mort</b> : combien de levées j'ai, combien il m'en faut, où trouver la différence.</li><li><b>Revoir ses donnes</b> après le tournoi : celles que l'on a perdues apprennent plus que celles que l'on a gagnées.</li></ol>
${KEEP('Même système, autre méthode : le champion compte tout, planifie avant de jouer et ne fait presque pas de cadeaux.')}` },
  { id: 'qualites', t: 'Les qualités d\'un grand champion', d: 'Ce qu\'il faut cultiver, et comment l\'entraîner ici', cases: [], html: `
<p>Aucun champion n'est né champion. Les grands joueurs ont simplement développé, plus loin que les autres, une quinzaine de qualités. Bonne nouvelle : toutes s'entraînent. Pour chacune, voici <b>où l'entraîner dans ce site</b>.</p>
${TBL(['Qualité', 'Ce que c\'est', 'Où l\'entraîner'], [
 ['La concentration', 'rester attentif 2 heures, donne après donne', 'Tournoi de 12 donnes ; Suivre les cartes (difficile)'],
 ['La mémoire des cartes', 'savoir ce qui est tombé', 'Compter › Suivre les cartes'],
 ['Le comptage', 'reconstituer les mains cachées', 'Compter ; Défense › comprendre et compter'],
 ['La logique', 'déduire ce qu\'on ne voit pas', 'Défense ; Jeux › Décisions'],
 ['L\'imagination', 'visualiser la main qui fait réussir (ou chuter) le contrat', 'Revoir mes donnes, cartes ouvertes'],
 ['La planification', 'faire un plan avant de jouer', 'L\'école de la carte (marches 9 et 10)'],
 ['La technique', 'maniements, impasses, coupes, affranchissements', 'L\'école de la carte ; Fiche maniements'],
 ['Les probabilités', 'choisir la ligne qui réussit le plus souvent', 'Quiz « Les probabilités »'],
 ['Le jugement', 'évaluer une main au-delà de ses points', 'Quiz « Le jugement » ; Le juste contrat'],
 ['La discipline', 'respecter le système, même sous pression', 'Exercices d\'enchères ; Examens'],
 ['Le partenariat', 'communiquer par les enchères et les signaux, faire confiance', 'Défendre en jouant les cartes (signaux)'],
 ['Le sang-froid', 'oublier la donne ratée, rester serein', 'Quiz « Éthique et mental »'],
 ['L\'éthique', 'jouer loyalement, sans information non autorisée', 'Quiz « Éthique et mental »'],
 ['L\'adaptation', 'jouer différemment au pourcentage ou en IMP, selon les adversaires', 'Tournoi IMP ; Décisions en IMP ; 4 niveaux d\'adversaires'],
 ['L\'humilité', 'analyser ses erreurs plutôt que la malchance', 'Carnet d\'erreurs ; Revoir mes donnes'],
])}
<h3>Les trois qualités que l'on néglige le plus</h3><p><b>Le jugement</b> : deux mains de 12 H ne se valent pas. Honneurs groupés dans les longues, intermédiaires (10, 9), honneurs bien placés derrière l'ouvreur : tout cela compte. <b>Les probabilités</b> : un champion ne « sent » pas une impasse, il compare 50 % et 36 %. <b>Le mental</b> : on perd plus de donnes par énervement ou fatigue que par ignorance.</p>
<h3>Une routine de champion, à chaque donne</h3><ol><li>Avant d'annoncer : je compte mes points, avec le bon comptage pour la situation.</li><li>Quand le mort arrive : je fais mon plan (objectif, levées sûres, sources, ordre).</li><li>À chaque pli : je compte les cartes adverses des couleurs importantes.</li><li>Après la donne : je l'oublie… jusqu'à l'analyse d'après tournoi.</li></ol>
${KEEP('Toutes les qualités du champion s\'entraînent. La plus rentable : une routine, appliquée à chaque donne, même les faciles.')}` },
  { id: 'palier1', t: 'Palier 1 · Débutant', d: 'Les fondations', cases: [], html: `
<p><b>Vous êtes à ce palier</b> si vous découvrez le bridge, ou si les enchères vous paraissent encore mystérieuses.</p>
<h3>Ce qu'il faut maîtriser pour passer au palier suivant</h3><ul><li>Le pli, l'atout, le contrat, le mort.</li><li>Compter ses points d'honneur sans hésiter, et savoir quand ajouter la distribution.</li><li>Ouvrir, et les réponses de base (soutien, nouvelle couleur, 1SA).</li><li>Les réponses à 1SA : Stayman et Texas.</li><li>L'école de la carte, marches 1 à 5 : encaisser, débloquer, chasser l'As, les atouts, les longueurs.</li></ul>
<h3>Les erreurs typiques</h3><ul><li>Compter la distribution sans fit.</li><li>Jouer la première carte du mort sans plan.</li><li>Oublier de faire tomber les atouts.</li></ul>
<h3>Le bon rythme</h3><p>Trois séances de 20 minutes par semaine valent mieux qu'une longue séance. Une donne de l'école de la carte par jour, et les révisions surprises font le reste.</p>
${KEEP('Le débutant apprend les règles. Objectif : jouer une donne entière sans se perdre.')}` },
  { id: 'palier2', t: 'Palier 2 · Intermédiaire', d: 'Les automatismes', cases: [], html: `
<p><b>Vous êtes à ce palier</b> quand vous jouez des donnes complètes sans aide, mais que certaines situations vous font encore hésiter.</p>
<h3>Ce qu'il faut maîtriser</h3><ul><li>Le 3e tour d'enchères et le rôle du capitaine.</li><li>Les interventions, le contre d'appel, le cue-bid, les barrages.</li><li>L'entame selon le contrat.</li><li>L'école de la carte, marches 6 à 10 : coupes, impasses, choisir la technique, le plan complet.</li><li>Suivre les cartes au niveau moyen.</li></ul>
<h3>Les erreurs typiques</h3><ul><li>Confondre les comptages selon la situation (voir la fiche « Quel comptage choisir ? »).</li><li>Faire l'impasse quand une couleur longue suffisait.</li><li>Intervenir sans les conditions du système.</li></ul>
${KEEP('L\'intermédiaire transforme les règles en automatismes. Objectif : 50 % en tournoi contre des intermédiaires.')}` },
  { id: 'palier3', t: 'Palier 3 · Bon joueur', d: 'Le jugement', cases: [], html: `
<p><b>Vous êtes à ce palier</b> quand vous atteignez la moyenne en tournoi et que vos erreurs deviennent des erreurs de jugement plutôt que de règles.</p>
<h3>Ce qu'il faut maîtriser</h3><ul><li>Les chelems (règles FFB) : HL/HLD, Blackwood 5 clés, la Dame d'atout.</li><li>La défense : comprendre leurs enchères, compter, les signaux.</li><li>Le duplicate : partielles, contres, levées de mieux ; les IMP.</li><li>Les mains extraordinaires.</li></ul>
<h3>Les erreurs typiques</h3><ul><li>Prendre des risques en IMP pour une levée de mieux.</li><li>Défendre sans compter les points du déclarant.</li><li>Rater un chelem par manque d'ambition… ou en déclarer un sans les clés.</li></ul>
${KEEP('Le bon joueur juge au lieu d\'appliquer. Objectif : 55 % contre de très bons joueurs.')}` },
  { id: 'palier4', t: 'Palier 4 · Champion', d: 'La constance', cases: [], html: `
<p><b>Ce palier ne se termine jamais</b> : même les champions du monde continuent de travailler.</p>
<h3>Ce qu'il faut cultiver</h3><ul><li>Les conventions des bons joueurs, adoptées une par une avec son partenaire.</li><li>La routine de champion, à chaque donne (voir « Les qualités d'un grand champion »).</li><li>Les probabilités et le jugement.</li><li>Le mental : la donne ratée est oubliée tout de suite.</li><li>L'analyse : revoir ses donnes, tenir son carnet d'erreurs.</li></ul>
<h3>Ce qui distingue vraiment le champion</h3><p>Pas les coups géniaux : <b>l'absence de cadeaux</b>. Il fait peu d'erreurs, et presque jamais deux fois la même.</p>
${KEEP('Le champion ne fait pas des miracles : il ne fait pas de cadeaux. Objectif : 60 % contre des champions.')}` },
  { id: 'lexique', t: 'Le lexique du bridgeur', d: 'Tous les mots, de A à Z', cases: [], html: `
<p>Le bridge a sa langue. La parler, c'est déjà jouer mieux (et impressionner au bar du club).</p>
${TBL(['Mot', 'Ce que ça veut dire'], [
 ['Affranchir', 'rendre maîtresses ses petites cartes en faisant tomber celles des adversaires'], ['Arrêt', 'une carte qui empêche l\'adversaire d\'encaisser toute sa couleur (As, Roi second, Dame troisième…)'], ['Barrage', 'enchère haute avec peu de points et une longue couleur, pour gêner'], ['Capitaine', 'celui des deux qui connaît le mieux la force du camp et décide du contrat'], ['Chicane', 'aucune carte dans une couleur (zéro)'], ['Contre d\'appel', 'contre qui demande au partenaire de choisir une couleur'], ['Coupe', 'jouer un atout quand on n\'a plus de la couleur demandée'], ['Cue-bid', 'enchère dans la couleur adverse : main forte, ou contrôle pour le chelem'], ['Défausse', 'jouer une carte d\'une autre couleur, sans couper'], ['Déclarant', 'le joueur qui joue le contrat'], ['Double mort', 'jeu parfait des quatre joueurs, cartes visibles : la référence des analyses'], ['Doubleton', 'deux cartes dans une couleur'], ['Entame', 'la première carte de la donne'], ['Fit', 'au moins 8 cartes à deux dans une couleur'], ['Forcing', 'enchère qui interdit au partenaire de passer'], ['Hold-up', 'laisser passer volontairement une levée pour couper les communications adverses'], ['Impasse', 'jouer vers un honneur en espérant que celui qui manque soit bien placé'], ['Levée (ou pli)', 'les quatre cartes jouées à chaque tour'], ['Main régulière', '4-3-3-3, 4-4-3-2 ou 5-3-3-2 : ni singleton ni chicane'], ['Maîtresse', 'la plus haute carte encore en jeu dans sa couleur'], ['Manche', '3SA, 4♥, 4♠, 5♣, 5♦ ou plus : la prime de manche'], ['Mort', 'le partenaire du déclarant, dont les cartes sont étalées'], ['Partielle', 'contrat en dessous de la manche'], ['Singleton', 'une seule carte dans une couleur'], ['Squeeze', 'forcer un adversaire à défausser une carte utile : le sommet de l\'art'], ['Surcontre', 'réponse à un contre, qui double encore la mise'], ['Texas', 'réponse dans la couleur juste en dessous de sa majeure 5e, sur 1SA'], ['Vulnérable', 'situation où primes et pénalités sont plus fortes']
])}
${KEEP('Un mot inconnu à la table ? Revenez ici. (Et si votre partenaire dit « squeeze » en souriant, méfiez-vous.)')}` },
  { id: 'aiguilleur', t: 'Quel comptage choisir ?', d: 'L\'aiguilleur : le bon calcul pour chaque situation', cases: ['compter', 'hld'], html: `
<p>On se trompe rarement dans l'addition. On se trompe de <b>méthode</b>. Avant d'additionner, posez-vous ces <b>trois questions, dans l'ordre</b>. La première réponse « oui » vous donne la méthode.</p>
<div class="tree">
<div class="node"><span class="qn">1</span><div><b>Est-ce que je cherche un chelem ?</b><br><span class="small">J'ai déjà vu qu'à deux on peut approcher 33 points.</span></div><div class="yes">Oui → <b>HL ou HLD</b> (règles FFB) : H + longueur (+1 par carte à partir de la 5e), et avec un fit en plus D (courtes, 9e atout).</div></div>
<div class="node"><span class="qn">2</span><div><b>Un fit de 8 cartes est-il connu, à coup sûr ?</b><br><span class="small">Pas « peut-être » : connu. Avec 5 cartes face à un 1SA, le fit n'est pas sûr.</span></div><div class="no">Non → <b>H seuls</b>. Rien d'autre, jamais.</div></div>
<div class="node"><span class="qn">3</span><div><b>Suis-je le répondant qui soutient la majeure 5e de mon partenaire ?</b></div><div class="yes">Oui → <b>H + courtes + atouts au-delà du 3e</b> (chicane 3, singleton 2, doubleton 1 ; +1 par atout à partir du 4e).</div><div class="no">Non (ouvreur soutenu, Texas avec 6 cartes, Stayman 4-4, fit mineur) → <b>H + courtes</b>, sans bonus d'atouts.</div></div>
</div>
<h3>Les situations, une par une</h3>${TBL(['Situation', 'Je compte', 'Pourquoi'], [
 ['J\'ouvre (premier à parler)', 'H seuls', 'On ne connaît pas encore de fit'],
 ['Barrage', 'la longueur fixe le palier', 'Les points servent juste de fourchette (6 à 10 H)'],
 ['Je réponds sans fit', 'H seuls', 'Pas de fit = pas de distribution'],
 ['Je soutiens la majeure 5e de l\'ouvreur', 'H + courtes + atouts au-delà du 3e', 'Fit sûr, et mes atouts serviront à couper'],
 ['J\'ai ouvert et mon partenaire m\'a soutenu', 'H + courtes', 'Fit sûr ; mes atouts sont déjà comptés comme longueur'],
 ['Face à 1SA, j\'ai une majeure 5e', 'H seuls', 'Le 1SA peut n\'avoir que 2 cartes : fit pas sûr'],
 ['Texas complété, j\'ai 6 cartes', 'H + courtes', 'Avec 6 cartes, le fit est garanti'],
 ['Stayman : fit 4-4 trouvé', 'H + courtes', 'Fit sûr'],
 ['Je pense au chelem', 'HL, puis HLD avec fit', 'Le chelem se compte avec les règles FFB'],
])}
<h3>Les trois pièges classiques</h3><ol><li><b>Ajouter un doubleton sans fit</b>. Sans fit, une couleur courte est une faiblesse, pas un atout.</li><li><b>Compter « atouts au-delà du 3e » quand on est l'ouvreur</b>. Ce bonus est réservé au répondant qui soutient.</li><li><b>Garder le comptage de la manche pour le chelem</b>. Dès que le chelem est en vue, on change de méthode : HL / HLD.</li></ol>
${KEEP('Chelem ? → HL/HLD. Pas de fit sûr ? → H seuls. Je soutiens sa majeure ? → H + courtes + atouts. Sinon → H + courtes.')}` },
  { id: 'maniement', t: 'Maniements de couleur', d: 'Levées sûres, impasse, affranchissement', cases: [], html: `
<h3>Compter les levées sûres d'une couleur</h3><p>Les levées sûres sont les cartes <b>maîtresses qui se suivent depuis l'As</b>, entre vos deux mains. Mais on ne fait jamais plus de levées que la <b>main la plus longue</b> n'a de cartes.</p><p>Exemple : A R D en face de 4 petites → 3 levées sûres. A R en face de D V → 2 levées seulement (les deux mains n'ont que 2 cartes).</p>
<h3>L'impasse : jouer VERS l'honneur</h3><p>Avec A D en face de petites cartes, jouez petit <b>de la main d'en face vers A D</b>. Si l'adversaire de gauche fournit petit, mettez la Dame : elle gagne chaque fois que le Roi est à gauche (une chance sur deux). Même idée avec un Roi seul : jouez vers lui.</p>
<h3>Affranchir</h3><p>R D V 10 en face de petites : jouez le Roi pour <b>chasser l'As</b>. Vous perdez un pli, puis la Dame, le Valet et le 10 sont maîtres. C'est la base du jeu à Sans-Atout.</p>
<h3>Huit toujours, neuf jamais</h3><p>Il vous manque la Dame. Avec <b>8 cartes</b> à deux, faites l'impasse. Avec <b>9 cartes</b>, tirez As et Roi : la Dame tombe plus souvent qu'elle ne se cache.</p>
<h3>Le hold-up à Sans-Atout</h3><p>L'adversaire entame sa longue couleur, vous avez l'As. <b>Règle de 7</b> : 7 − vos cartes dans la couleur (à deux) = nombre de fois où vous laissez passer. A x x en face de x x : 7 − 5 = 2 fois. Le partenaire de l'entameur n'aura plus de carte pour lui redonner la main.</p>
<h3>Quand changer de comptage : les honneurs ou les longueurs ?</h3>
<p>Beaucoup de joueurs comptent toujours de la même façon. Or il faut <b>changer de lunettes</b> selon la situation :</p>
${TBL(['Situation', 'Je compte…', 'Pourquoi'], [['Enchères, main régulière', 'mes points H', 'la force vient des honneurs'], ['Enchères, bicolore 5-5 ou 6-5', 'mes longueurs (et mes perdantes)', 'une main longue fait des levées sans honneurs : 9 H bien placés peuvent valoir une ouverture'], ['Jeu à Sans-Atout', 'mes levées sûres, puis mes levées de longueur', 'les petites cartes d\'une couleur longue deviennent maîtresses une fois les adversaires épuisés'], ['Jeu à la couleur', 'mes perdantes dans la main longue en atout', 'on les coupe au mort ou on les défausse'], ['Couleur longue à affranchir', 'les cartes adverses et leurs tours', '5 cartes adverses : il faut le plus souvent 3 tours (répartition 3-2)']])}
<p><b>Le déclic</b> : à Sans-Atout, avec <b>A R 6 5 3</b> en face de <b>7 4 2</b>, les honneurs ne promettent que 2 levées. Les longueurs en promettent <b>4</b> : As, Roi, on cède un tour, et les deux dernières petites cartes sont maîtresses si les adversaires sont 3-2. C'est souvent là que se cache la 9e levée de 3SA.</p>
<p><b>Le prix</b> : affranchir coûte un ou deux tours, donc il faut <b>commencer tôt</b>, tant que vous avez encore des arrêts dans les autres couleurs et des <b>remontées</b> vers la main longue.</p>
<h3>L'impasse, pour les débutants : le piège du Roi</h3>
<p>Imaginez que vous avez l'<b>As et la Dame</b> au mort, en face de deux petites cartes. Il vous manque le Roi. Si vous jouez l'As puis la Dame, le Roi mange la Dame : une seule levée.</p>
<p>L'astuce : jouez <b>petit de votre main, vers l'As-Dame</b>. Ouest joue avant le mort. S'il met le Roi, votre As le prend et la Dame devient maîtresse. S'il met petit, vous mettez la Dame, qui gagne si le Roi est chez Ouest : il est <b>pris en sandwich</b>.</p>
<p>Une chance sur deux de gagner une levée « gratuite » : c'est l'impasse. Retenez la phrase : <b>on joue toujours VERS l'honneur qu'on veut protéger, jamais l'honneur lui-même</b>.</p>

const DRILLS = {
  atouts: { t: 'Atouts restants', d: 'Compter à rebours les atouts adverses' },
  repart: { t: 'Répartition', d: 'Qui a les cartes qui manquent ?' },
  treize: { t: 'La règle des 13', d: 'Trouver la 4e couleur d\'une main' },

const SEAT_LBL = { O: 'Ouest', E: 'Est' };
function drillQ(type) {
  const r = k => rnd(k), suitT = pick(SU);
  if (type === 'atouts') {

  }

  }
  if (type === 'treize') {
    const lens = shuffle([[5, 4, 3, 1], [5, 3, 3, 2], [6, 3, 2, 2], [4, 4, 3, 2], [6, 4, 2, 1], [5, 5, 2, 1], [7, 3, 2, 1], [4, 3, 3, 3]][r(8)]);

    const src = pick(['Ouest a ouvert et le jeu a montré', 'Au fil du jeu, Est a montré', 'Les enchères et le jeu ont montré chez Ouest']);
    return { kind: 'num', prompt: `${src} : ${shown.join(', ')}.<br><b>Combien de ${NOMS[SU[idx]]} a-t-il ?</b>`, value: lens[idx], expl: `13 − (${lens.filter((_, i) => i !== idx).join(' + ')}) = ${lens[idx]}.` };
  }
  if (type === 'points') {
    const me = 10 + r(8), dum = 8 + r(8); if (me + dum > 32) return drillQ('points');
    const theirs = 40 - me - dum, op = Math.random() < .5;
    if (op && theirs >= 12) return { kind: 'num', prompt: `Vous avez ${me} H, le mort ${dum} H. Ouest a ouvert (12 H et plus).<br><b>Combien de points Est a-t-il au maximum ?</b>`, value: theirs - 12, expl: `40 − ${me} − ${dum} = ${theirs} chez eux. Ouest en a au moins 12 → Est en a au plus ${theirs - 12}.` };
    return { kind: 'num', prompt: `Vous avez ${me} H, le mort ${dum} H.<br><b>Combien de points ont les adversaires à eux deux ?</b>`, value: theirs, expl: `40 − ${me} − ${dum} = ${theirs}.` };
  }
  if (type === 'honneur') {
    const vals = [['l\'As', 4], ['le Roi', 3], ['la Dame', 2]];
    for (let t = 0; t < 50; t++) {
      const shown = 6 + r(6), [nm, hv] = pick(vals), s = pick(SU);
      const passed = shown + hv >= 12; // s'il l'avait, il aurait pu ouvrir
      if (!passed) continue;
      return { kind: 'mcq', prompt: `Est a passé au début (moins de 12 H). Pendant le jeu, il a déjà montré ${shown} H. Il manque ${nm} de ${NOM[s]}.<br><b>Qui l'a ?</b>`, opts: ['Est', 'Ouest', 'On ne peut pas savoir'], a: 1, expl: `Avec ${nm} (${hv} H), Est aurait ${shown + hv} H : il aurait ouvert. C'est donc Ouest.` };
    }
    return drillQ('treize');
  }
  if (type === 'hcp') { const h = genHand({ hcp: [4, 22] }); return { kind: 'num', hand: h, prompt: '<b>Combien de points d\'honneur dans cette main ?</b>', value: hcp(h), expl: SU.map(s => `${SYM[s]} ${h[s].filter(x => x >= 11).map(rk).join(' ') || '—'} = ${hs(h[s])}`).join(' · ') + ` → ${hcp(h)}.` }; }
  return drillQ(pick(Object.keys(DRILLS)));
}

function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

// ---------------- accueil ----------------
function statusPill(c, frontierId) {
  const s = cs(c.id);
  if (s.acq && s.weak) return '<span class="pill weak">à consolider</span>';
  if (s.acq) return '<span class="pill acq">✓ acquis</span>';
  if (c.id === frontierId) return `<span class="pill cur">en cours · ${s.streak}/2</span>`;
  if (s.streak) return `<span class="pill">${s.streak}/2</span>`;
  return '<span class="pill">—</span>';
}
function trackBlock(track, title, desc) {
  const list = CASES.filter(c => c.track === track);
  const acq = list.filter(c => cs(c.id).acq).length;
  const fr = list.find(c => !cs(c.id).acq);
  return `<div class="card"><h2>${title}</h2><div class="small">${desc}</div>
  <div class="prog"><i style="width:${Math.round(100 * acq / list.length)}%"></i></div>
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="small">${acq} cas acquis sur ${list.length}</span><button class="btn" data-go="${track}">${acq ? 'Continuer' : 'Commencer'} le parcours ›</button></div>
  <ul class="cases">${list.map(c => `<li data-case="${c.id}"><span class="num">${c.num}</span><span class="t">${c.title}</span>${statusPill(c, fr && fr.id)}</li>`).join('')}</ul></div>`;
}
function freeBlock() {
  ST.free = ST.free || {};
  const col = role => { const h = ST.free[role] || []; const notes = h.map(x => x.note); const last = notes.length ? notes[notes.length - 1] : null; const l5 = notes.slice(-5); const avg = l5.length ? (l5.reduce((a, b) => a + b, 0) / l5.length).toFixed(1).replace('.', ',') : '—'; const best = notes.length ? Math.max(...notes) : '—';
    return `<div class="role"><div class="rt">${ROLES[role]}</div><div class="rs"><span class="big">${last === null ? '—' : last}<small>/10</small></span><span class="small">dernière série</span></div><div class="small">Moyenne des 5 dernières : <b>${avg}</b> · Meilleure : <b>${best}</b> · ${notes.length} série${notes.length > 1 ? 's' : ''}</div><div class="spark">${notes.slice(-10).map(v => `<i style="height:${Math.max(6, v * 10)}%" title="${v}/10"></i>`).join('') || '<span class="small">pas encore de série</span>'}</div><button class="btn" style="padding:8px 12px;font-size:14px" data-free="${role}">Série de 5 donnes ›</button></div>`; };
  return `<div class="card"><h2>Exercices libres</h2><div class="small">Des donnes complètes, jouées jusqu'au bout des enchères, avec de temps en temps un piège. Chaque série de 5 donnes reçoit une note sur 10, et vos notes sont suivies séparément pour chaque rôle.</div><div class="roles">${col('open')}${col('resp')}${col('def')}</div></div>`;
}
function selBlock() {
  const sel = new Set(ST.sel);
  const grp = (track, t) => `<div class="label" style="margin-top:10px">${t}</div><div class="sel">${CASES.filter(c => c.track === track).map(c => `<label class="ck"><input type="checkbox" data-sel="${c.id}" ${sel.has(c.id) ? 'checked' : ''}><span>${c.num} · ${c.short}</span></label>`).join('')}</div>`;
  return `<div class="card"><h2>Entraînement à la carte</h2><div class="small">Cochez ce que vous voulez travailler : les exercices seront tirés au hasard parmi ces cas. Les compteurs avancent comme dans le parcours.</div>
  <div class="acts" style="margin-top:8px"><button class="btn sec small" data-pre="all">Tout</button><button class="btn sec small" data-pre="none">Rien</button><button class="btn sec small" data-pre="weak">À consolider</button><button class="btn sec small" data-pre="todo">Pas encore acquis</button></div>
  ${grp('bid', 'Enchères')}${grp('lead', 'Entames')}${grp('slam', 'Chelems (FFB)')}
  <div class="acts" style="margin-top:12px"><button class="btn" data-mix="1" ${ST.sel.length ? '' : 'disabled'}>S'entraîner sur ma sélection (${ST.sel.length} cas) ›</button></div></div>`;
}
function saveBlock() {
  const st = CLOUD ? '<p class="okline">✓ Votre progression est enregistrée sur votre compte Claude : elle vous suit sur tous vos appareils.</p>' : LS_OK ? '<p class="small">Votre progression est enregistrée dans ce navigateur. Si elle disparaît quand vous rouvrez le fichier (c\'est le cas dans certains aperçus de fichiers, sur iPhone notamment), copiez votre code de sauvegarde avant de quitter et collez-le en revenant.</p>' : '<p class="warnline">⚠ Ici, le navigateur n\'enregistre rien. Avant de quitter, copiez votre code de sauvegarde ; en revenant, collez-le ci-dessous.</p>';
  return `<div class="card set"><h2>Ma progression</h2>${st}
   <div class="label">Mon code de sauvegarde</div><textarea id="code" readonly rows="2">${backupCode()}</textarea>
   <div class="acts"><button class="btn sec small" id="copy">Copier le code</button></div>
   <div class="label" style="margin-top:12px">Restaurer avec un code</div><textarea id="paste" rows="2" placeholder="Collez ici votre code BN2-…"></textarea>
   <div class="acts"><button class="btn sec small" id="restore">Restaurer</button></div></div>`;

app.addEventListener('click', e => {
  const t = e.target.closest('[data-free],[data-cnt],[data-cntv],[data-num],[data-go],[data-case],#imp,#rst,#copy,#restore,[data-pre],[data-mix],[data-bid],[data-reason],[data-card],[data-act]');
  if (!t) return;
  if (t.dataset.cnt) { if (t.dataset.cnt === 'yes') { X.phase = 'cntnum'; return render(); } if (t.dataset.cnt === 'back') { X.phase = 'count'; return render(); } return onCount(false, hcp(X.ex.hand)); }
  if (t.dataset.cntv) return onCount(true, +t.dataset.cntv);
  if (t.dataset.num) return onNum(+t.dataset.num);
  if (t.dataset.pre) { const p = t.dataset.pre; ST.sel = CASES.filter(c => p === 'all' || (p === 'weak' && cs(c.id).acq && cs(c.id).weak) || (p === 'todo' && !cs(c.id).acq)).map(c => c.id); save(); if (p === 'weak' && !ST.sel.length) toast('Aucun cas à consolider pour l\'instant'); return home(); }
  if (t.dataset.mix) return startMix();
  if (t.id === 'copy') { const ta = document.getElementById('code'); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (er) { } if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(() => toast('Code copié'), () => toast(ok ? 'Code copié' : 'Sélectionnez le code et copiez-le')); else toast(ok ? 'Code copié' : 'Sélectionnez le code et copiez-le'); return; }
  if (t.id === 'restore') { const v = document.getElementById('paste').value; if (restoreCode(v)) { toast('Progression restaurée'); home(); } else toast('Ce code n\'est pas valide'); return; }
  if (t.dataset.go) return startPath(t.dataset.go);
  if (t.dataset.case) return startCase(caseById(t.dataset.case), 'free');
  if (t.id === 'imp') { ['soutien', 'sansfit', 'mineure', 'texas', 'stayman', 'troisieme'].forEach(id => { const s = cs(id); s.acq = true; s.streak = 2; }); cs('soutien').weak = true; cs('sansfit').weak = true; save(); toast('Progression reprise : 6 cas acquis, 2 à consolider'); return home(); }
  if (t.id === 'rst') { if (confirmReset()) { ST = normalize({ opt: ST.opt }); save(); menu(); } return; }
  if (t.dataset.bid && !t.disabled) return onBid(t.dataset.bid);
  if (t.dataset.reason) return onReason(t.dataset.reason);
  if (t.dataset.card) return onCard(t.dataset.card);
  if (t.dataset.act === 'home') return home();
  if (t.dataset.act === 'next') return X.mode === 'path' ? startPath(X.track) : X.mode === 'mix' ? startMix() : startCase(X.c, 'free');
  if (t.dataset.act === 'cont') return continueSteps();
  if (t.dataset.act === 'nextfree') return nextFree();
  if (t.dataset.act === 'seriesend') return seriesEnd();
  if (t.dataset.free) return startSeries(t.dataset.free);
});
let resetArmed = 0;
function confirmReset() { if (Date.now() - resetArmed < 4000) return true; resetArmed = Date.now(); toast('Touchez encore une fois pour confirmer'); return false; }
app.addEventListener('change', e => {
  if (e.target.id === 'optH') { ST.opt.showH = e.target.checked; save(); }
  if (e.target.dataset && e.target.dataset.sel) { const id = e.target.dataset.sel; ST.sel = ST.sel.filter(x => x !== id); if (e.target.checked) ST.sel.push(id); save(); const b = app.querySelector('[data-mix]'); if (b) { b.disabled = !ST.sel.length; b.textContent = `S'entraîner sur ma sélection (${ST.sel.length} cas) ›`; } }
});
let lastMix = null;
function startMix() { const ids = ST.sel.filter(id => caseById(id)); if (!ids.length) return home(); let id = pick(ids); if (ids.length > 1 && id === lastMix) id = pick(ids); lastMix = id; startCase(caseById(id), 'mix'); }

// ---------------- choix de l'exercice ----------------
function startPath(track) {
  const list = CASES.filter(c => c.track === track);
  const acq = list.filter(c => cs(c.id).acq), weak = acq.filter(c => cs(c.id).weak);
  const fr = list.find(c => !cs(c.id).acq);
  let c, surprise = false;
  if (!fr) { c = weak.length && Math.random() < .6 ? pick(weak) : pick(acq); surprise = true; }
  else if (acq.length && !lastRev && Math.random() < (weak.length ? .35 : .2)) { c = weak.length && Math.random() < .7 ? pick(weak) : pick(acq); surprise = true; }
  else c = fr;
  lastRev = surprise;
  startCase(c, 'path', surprise);
}
function startCase(c, mode, surprise) {
  const ex = makeExercise(c);
  if (!ex) { toast('Petit souci de génération, on réessaie'); return setTimeout(() => startCase(c, mode, surprise), 50); }
  X = { c, ex, mode, track: c.track, surprise: !!surprise, rev: cs(c.id).acq, si: 0, calls: ex.calls.slice(), notes: ex.notes.slice(), vul: pick(VULS), phase: ex.kind === 'lead' ? 'card' : ex.kind === 'count' ? 'num' : 'count', results: [], sr: [], fbs: [], picked: null, order: null };
  render();
}

// ---------------- rendu de l'exercice ----------------
function headerLabel() {
  if (X.mode === 'libre') return `Exercices libres · ${ROLES[X.series.role]} <span class="chip">donne ${X.series.i}/5</span>`;
  const s = cs(X.c.id), c = X.c;
  if (X.rev) return `${X.surprise ? 'Révision surprise' : 'Révision'} · Cas ${c.num} · ${c.short}${s.weak ? ' <span class="chip">à consolider</span>' : ''}`;
  return `Cas ${c.num} · ${c.short} <span class="chip">${s.streak}/2</span>`;
}
function aucTable(heroSeat, waiting, heroCall) {
  const ex = X.ex, start = SEATS.indexOf(ex.dealer);
  const cells = []; for (let i = 0; i < start; i++) cells.push('');
  X.calls.forEach(b => cells.push(BC(b)));
  if (waiting) cells.push('?'); else if (heroCall && !X.freeDone) cells.push('»' + BC(heroCall));
  if (!cells.length) cells.push(waiting ? '?' : '');
  let rows = ''; for (let i = 0; i < cells.length; i += 4) { rows += '<tr>' + [0, 1, 2, 3].map(k => { const v = cells[i + k]; const mine = v && v[0] === '»'; return `<td class="${v === '?' ? 'q' : mine ? 'mine' : ''}">${v === undefined ? '' : mine ? v.slice(1) : v}</td>`; }).join('') + '</tr>'; }
  return `<table class="auc"><tr>${SEATS.map(s => `<th class="${s === heroSeat ? 'me' : ''}">${SEATNAME[s]}${s === heroSeat ? ' (vous)' : ''}</th>`).join('')}</tr>${rows}</table>`;
}
function handHtml(h) {
  return `<div class="hand">${['S', 'H', 'D', 'C'].map(s => `<div>${SYM[s]} ${h[s].length ? h[s].map(rk).join(' ') : '—'}</div>`).join('')}</div>${ST.opt.showH ? `<div class="hcp">${hcp(h)} points d'honneur</div>` : ''}`;
}
function leadHand(h, st) {
  return `<div class="lead">${['S', 'H', 'D', 'C'].map(s => `<div class="hrow"><span>${SYM[s]}</span><div class="cards">${h[s].length ? h[s].map(r => { const id = s + r; let cl = 'cbtn'; if (X.picked === id) cl += X.phase === 'card' ? ' sel' : (id === st.card ? ' good' : ' wrong'); else if (X.phase !== 'card' && X.phase !== 'reason' && id === st.card) cl += ' good'; return `<button class="${cl}" data-card="${id}" ${X.phase !== 'card' ? 'disabled' : ''}>${rk(r)}</button>`; }).join('') : '<span class="small">—</span>'}</div></div>`).join('')}</div>${ST.opt.showH ? `<div class="hcp">${hcp(h)} points d'honneur</div>` : ''}`;
}
function notesHtml() {
  return `<ul class="notes">${X.notes.map(nt => `<li>${nt.b ? `<b>${SEATNAME[nt.s]}, ${BC(nt.b)}</b> : ` : ''}${nt.t}</li>`).join('')}</ul>`;
}
function bidBox() {
  let mx = -1; X.calls.forEach(b => { if (b !== 'P' && b !== 'X' && b !== 'XX') mx = Math.max(mx, bidIdx(b)); });
  let html = '<div class="bb">';
  for (let l = 1; l <= 7; l++) for (const s of STR) { const b = l + s; html += `<button class="bid" data-bid="${b}" ${bidIdx(b) <= mx ? 'disabled' : ''}>${l}${s === 'N' ? 'SA' : SYM[s]}</button>`; }
  html += `</div><div class="bb2"><button class="bid pass" data-bid="P">Passe</button><button class="bid dbl" data-bid="X" ${mx < 0 ? 'disabled' : ''}>Contre</button></div>`;
  return html;
}
function render() {
  const ex = X.ex, st = ex.steps[X.si], lead = ex.kind === 'lead';
  const hero = lead ? 'O' : 'S';
  const count = ex.kind === 'count';
  const sit = lead ? `Vous êtes <b>Ouest</b> · Contrat : <b>${B(ex.contract)}</b> joué par Sud · Vulnérabilité : ${X.vul}` : `Vous êtes <b>Sud</b> · Donneur : ${SEATNAME[ex.dealer]} · Vulnérabilité : ${X.vul}`;
  let interact = '';
  if (X.phase === 'count') interact = `<div class="card"><div class="q">Avant d'enchérir : comment comptez-vous vos points à ce stade ?</div><div class="cnt"><button class="reason" data-cnt="no"><b>${st.count && st.count.ffb ? 'Rien à ajouter à ce stade (FFB)' : 'Distribution : sans utilité à ce stade'}</b><br><span class="small">je garde mes ${hcp(ex.hand)} points d'honneur</span></button><button class="reason" data-cnt="yes"><b>${st.count && st.count.ffb ? 'J\'ajoute la longueur (L) et/ou la distribution (D)' : 'J\'ajoute les points de distribution'}</b><br><span class="small">je donnerai mon total${st.count && st.count.ffb ? ' en HL ou HLD' : ''}</span></button></div></div>`;
  else if (X.phase === 'cntnum') interact = `<div class="card"><div class="q">Votre total, distribution comprise :</div><div class="bb">${Array.from({ length: 41 }, (_, i) => `<button class="bid" data-cntv="${i}">${i}</button>`).join('')}</div><div class="acts" style="margin-top:8px"><button class="btn sec small" data-cnt="back">‹ Revenir au choix</button></div></div>`;
  else if (X.phase === 'bid') interact = `<div class="card"><div class="q">${st.q}</div>${bidBox()}</div>`;
  else if (X.phase === 'num') interact = `<div class="card"><div class="q">${st.q}</div><div class="bb">${Array.from({ length: 41 }, (_, i) => `<button class="bid" data-num="${i}">${i}</button>`).join('')}</div></div>`;
  else if (X.phase === 'card') interact = `<div class="card"><div class="q">${st.q} <span class="small">(touchez la carte)</span></div></div>`;
  else if (X.phase === 'reason') {
    const opts = X.order;
    interact = `<div class="fb ok"><h3>✓ ${count ? `Bon compte : ${X.picked} points` : lead ? 'Bonne carte : ' + rk(+st.card.slice(1)) + SYM[st.card[0]] : 'Bonne enchère : ' + BC(X.picked)}</h3><p>Maintenant, <b>pourquoi ?</b> ${count ? 'Choisissez le bon détail du calcul.' : 'Choisissez la bonne justification.'}</p></div><div class="card"><div class="reasons">${opts.map((o, i) => `<button class="reason" data-reason="${i}">${o.t}</button>`).join('')}</div></div>`;
  }
  const fbs = X.fbs.join('');
  let after = '';

  if (X.phase === 'freeend') after = `<div class="acts"><button class="btn" data-act="${FS.i >= 5 ? 'seriesend' : 'nextfree'}">${FS.i >= 5 ? 'Voir la note de la série ›' : 'Donne suivante ›'}</button><button class="btn sec" data-act="home">Accueil</button></div>`;
  if (X.phase === 'done') after = `<div class="acts"><button class="btn" data-act="next">Exercice suivant ›</button><button class="btn sec" data-act="home">Parcours</button></div>`;
  const waiting = !lead && !count && (X.phase === 'bid' || X.phase === 'count' || X.phase === 'cntnum');
  const heroCall = lead || count || waiting ? null : (X.picked || (X.phase === 'done' ? st.accept[0] : null));
  show(`<div class="top"><div class="in"><button class="back" data-act="home">‹ Retour</button><div><h1 style="font-size:16px">${headerLabel()}</h1><div class="sub">${X.c.title}</div></div></div></div>
  <div class="wrap">
   <div class="card"><div class="sit">${sit}</div><div class="label">Votre main</div>${lead ? leadHand(ex.hand, st) : handHtml(ex.hand)}</div>
   <div class="card"><div class="label">Les enchères</div>${aucTable(hero, waiting, heroCall)}${X.notes.length ? `<div class="label" style="margin-top:12px">Ce que disent les annonces</div>${notesHtml()}` : ''}
    <details><summary>Rappel de la règle</summary>${X.mode === 'libre' ? ((caseById(st.cid) || {}).memo || `<p>${st.short || ''}</p>`) : X.c.memo}</details></div>
   ${fbs}${interact}${after}
  </div>`);
}

// ---------------- réponses ----------------
function qHtml(i, title) {
  let q = (X.ex.steps[i] && X.ex.steps[i].qs) || questionsFor(X.c.id, X.ex, i); if (!q || !q.length) return '';
  const cst = X.ex.steps[i] && X.ex.steps[i].count;
  if (cst) q = [{ q: cst.ffb ? 'Que dois-je compter à ce stade (H, HL, HLD ou des clés) ?' : 'Les points de distribution servent-ils à ce stade ?', a: cst.ffb ? (cst.useful ? `${cst.why} ${cst.txt}.` : `Seulement mes H : rien à ajouter. ${cst.why}`) : cst.useful ? `Oui. ${cst.why} ${cst.txt}.` : `Non : sans utilité à ce stade. ${cst.why}`, on: false }].concat(q);
  return `<div class="qs"><div class="label">${title || 'Les questions à se poser, dans l\'ordre'}</div><ol>${q.map(x => `<li class="${x.on ? 'on' : ''}"><b>${x.q}</b><br>${x.a}</li>`).join('')}</ol></div>`;
}
function fullWhy(st) { const lead = `<p>${st.why}</p>`; const ex = st.explain.startsWith(lead) ? st.explain.slice(lead.length) : st.explain; return `${qHtml(X.si)}<p><b>Pourquoi :</b> ${st.why}</p>${ex}`; }
function onBid(b) {
  if (X.phase !== 'bid') return;
  const st = X.ex.steps[X.si];
  if (st.accept.includes(b)) {
    X.picked = b; X.phase = 'reason';
    X.order = shuffle([{ t: st.short || st.why, ok: true }].concat(st.traps.slice(0, 3).map(t => ({ t, ok: false }))));
    return render();
  }
  const hint = st.diag ? st.diag(b) : null;
  const rest = X.mode === 'libre' ? [] : X.ex.steps.slice(X.si + 1);
  X.sr[X.si] = 'fail';
  X.fbs.push(`<div class="fb bad"><h3>✗ Vous avez dit ${BC(b)}. La bonne enchère : ${st.accept.map(BC).join(' ou ')}.</h3>${hint ? `<p class="hint">${hint}</p>` : ''}${rest.length ? `<p><b>La suite attendue :</b> ${rest.map(r => BC(r.bid)).join(', puis ')}.</p>` : ''}${fullWhy(st)}${rest.map((r, k) => qHtml(X.si + 1 + k, 'Puis, après la réponse de Nord : les questions suivantes')).join('')}</div>`);
  X.results.push('fail');
  if (X.mode === 'libre' && X.si < X.ex.steps.length - 1) { X.picked = st.accept[0]; X.fbs.push('<p class="small" style="margin:-4px 2px 12px"><b>Les enchères continuent avec la bonne enchère.</b></p>'); X.phase = 'stepdone'; return render(); }
  finish();
}
function onReason(i) {
  if (X.phase !== 'reason') return;
  const st = X.ex.steps[X.si], o = X.order[+i];
  const lead = X.ex.kind === 'lead';
  const good = X.order.find(x => x.ok);
  const what = lead ? `${rk(+st.card.slice(1))}${SYM[st.card[0]]}` : X.ex.kind === 'count' ? `${X.picked} points` : BC(X.picked);
  if (o.ok) { X.fbs.push(`<div class="fb ok"><h3>✓ ${what}, et la bonne justification.</h3>${lead ? qHtml(0) + st.explain : fullWhy(st)}</div>`); if (!X.sr[X.si]) X.sr[X.si] = 'ok'; X.results.push('ok'); }
  else { X.fbs.push(`<div class="fb mid"><h3>${lead ? 'Bonne carte' : X.ex.kind === 'count' ? 'Bon compte' : 'Bonne enchère'} (${what}), mais pas la bonne justification.</h3><p>Vous avez choisi : « ${o.t} »</p><p><b>La bonne raison :</b> ${good.t}</p>${lead ? qHtml(0) + st.explain : fullWhy(st)}</div>`); if (X.sr[X.si] !== 'fail') X.sr[X.si] = 'partial'; X.results.push('partial'); }
  if (X.si < X.ex.steps.length - 1) { X.phase = 'stepdone'; render(); }
  else finish();
}
function continueSteps() {
  const st = X.ex.steps[X.si];
  X.calls.push(X.picked); X.calls = X.calls.concat(st.after.calls); X.notes = X.notes.concat(st.after.notes);
  X.si++; X.phase = X.ex.steps[X.si].count ? 'count' : 'bid'; X.picked = null; X.fbs = []; render();
}
function onCount(withDist, v) {
  const st = X.ex.steps[X.si], c = st.count, H = hcp(X.ex.hand);
  const ok = c.useful ? ((withDist && v === c.value) || (c.noBonus && !withDist)) : !withDist;
  const said = withDist ? `vous ajoutez ${c.ffb ? 'L/D' : 'la distribution'} : ${v} points` : `${c.ffb ? 'rien à ajouter' : 'distribution sans utilité'}, ${H} H`;

  if (PG.ecole && PG.ecole.m !== 'mb' && typeof ecoleHint === 'function') { PG.hint = ecoleHint(); return playRender(); }
  if (PG.mode === 'def') {
    const started = G.tricks.length || G.cur.length, need = playNeed(), ns = G.tricks.filter(t => PSIDE(t.win) === 'NS').length;
    if (!started) PG.hint = PG.tr ? 'Contre une couleur : entamez en tête d\'une séquence d\'honneurs (R-D-V : le Roi), ou un singleton pour couper plus tard. Évitez d\'entamer sous un As.' : 'Contre Sans-Atout : entamez la 4e meilleure de votre couleur la plus longue (ou la tête d\'une séquence). Le but : affranchir vos longueurs avant le déclarant.';
    else PG.hint = `Il vous faut encore <b>${Math.max(0, need - ns)}</b> levée${need - ns > 1 ? 's' : ''}. Les réflexes : 2e main basse, 3e main haute ; couvrez un honneur par un honneur ; rejouez la couleur de votre partenaire s'il a fait un appel. Et comptez les cartes du mort : vous les voyez !`;

  if (!G.tricks.length && !G.cur.length) { PG.hint = 'Ouest va entamer. Avant de jouer, faites votre plan !'; return playRender(); }
  if (G.tricks.length <= 1) {
    if (!PG.tr) { const sure = SU.reduce((a, s) => a + topTricks(H.N, H.S, s), 0); PG.hint = `${PG_TIPS.nt} Au départ, vous aviez <b>${sure}</b> levée${sure > 1 ? 's' : ''} sûre${sure > 1 ? 's' : ''} pour ${PG.level + 6} à faire.`; }
    else { const lo = SU.reduce((a, s) => a + losersIn(H.S, s), 0); PG.hint = `${PG_TIPS.tr} Au départ, votre main comptait <b>${lo}</b> perdante${lo > 1 ? 's' : ''} ; vous pouvez en perdre ${13 - PG.level - 6}.`; }
    return playRender();
  }
  const oppTr = PG.tr ? G.live.E[PG.tr].length + G.live.O[PG.tr].length : 0;
  if (PG.tr && oppTr) PG.hint = `Il reste <b>${oppTr}</b> atout${oppTr > 1 ? 's' : ''} chez les adversaires. Sauf si vous devez couper au mort d'abord, pensez à les faire tomber.`;
  else if (PG.tr) PG.hint = 'Les atouts adverses sont tombés : encaissez vos levées maîtresses et affranchissez votre longue.';
  else { const m = SU.filter(s => (gHas(G, 'N', s) && gMaster(G, s, gHigh(G, 'N', s), 'N')) || (gHas(G, 'S', s) && gMaster(G, s, gHigh(G, 'S', s), 'S'))); PG.hint = m.length ? `Vous avez des cartes maîtresses à ${m.map(s => SYM[s]).join(' ')}. Avant de les encaisser, vérifiez que vous ne bloquez pas une couleur (jouez d'abord l'honneur de la main courte).` : 'Plus de carte maîtresse ? Il faut en créer : jouez vers vos honneurs, ou affranchissez une couleur longue.'; }
  playRender();
}
function playEnd() {
  const G = PG.G, need = playNeed(), ns = G.tricks.filter(t => PSIDE(t.win) === 'NS').length, diff = ns - need, def = PG.mode === 'def'; PG.done = true;
  const g = ST.games; if (def) { g.defPlayed = (g.defPlayed || 0) + 1; if (diff >= 0) g.flancOk = (g.flancOk || 0) + 1; } else { g.played = (g.played || 0) + 1; if (diff >= 0) g.made = (g.made || 0) + 1; } save();
  const ctr = `${PG.level}${PG.tr ? SYM[PG.tr] : 'SA'}`, declT = def ? 13 - ns : ns, sc0 = dupScore(PG.level, PG.tr || 'N', 0, false, declT), sc = def ? -sc0 : sc0, ddMine = PG.dd == null ? null : def ? 13 - PG.dd : PG.dd;
  const head = diff >= 0 ? pick(praise(diff > 0 ? 'big' : 'ok')) : pick(oops());
  let ddTxt = '';
  if (ddMine != null) ddTxt = ns > ddMine ? `Avec un jeu parfait des deux côtés, votre camp fait ${ddMine} levées : ${def ? 'le déclarant' : 'les défenseurs'} vous ${ns - ddMine > 1 ? 'ont' : 'a'} offert ${ns - ddMine} levée${ns - ddMine > 1 ? 's' : ''}. Merci qui ?` : ns === ddMine ? `Avec un jeu parfait des deux côtés, votre camp fait ${ddMine} levées : vous avez joué <b>comme un ordinateur</b>. Un peu inquiétant, mais bravo.` : `Avec un jeu parfait, votre camp pouvait faire ${ddMine} levées : ${ddMine - ns} vous ${ddMine - ns > 1 ? 'ont échappé' : 'a échappé'}. ${PG.open ? 'Rejouez-la : les quatre mains sont visibles, cherchez le meilleur plan.' : 'Rejouez la donne mentalement : où était le meilleur plan ?'}`;
  if (diff >= 0) celebrate();
  show._play = true; show(`${topBar(PG.title, 'Résultat', PG.back)}<div class="wrap">
  <div class="card ${diff >= 0 ? 'win' : ''}"><div class="label">${ctr} · ${ns} levées</div><div class="big2">${def ? (diff >= 0 ? `Chuté de ${diff + 1} !` : declT - PG.level - 6 > 0 ? `Réussi +${declT - PG.level - 6} par le déclarant` : 'Contrat réussi par le déclarant') : diff === 0 ? 'Contrat réussi' : diff > 0 ? `Réussi, +${diff}` : `Chute de ${-diff}`}</div><p><b>${head}</b></p><p class="small">${sc > 0 ? `Marque : +${sc} (non vulnérable).` : `Marque : ${sc} pour les adversaires (non vulnérable).`} ${ddTxt}</p></div>
  ${PG.ecole && typeof ecoleDebrief === 'function' ? ecoleDebrief(ns, need) : ''}
  <div class="card"><div class="label">Toute la donne</div>${handsDiagramB(G.H, PG.decl, { level: PG.level, st: PG.tr || 'N', dbl: 0, decl: PG.decl })}</div>
  <div class="card"><div class="label">Les 13 plis</div>${G.tricks.map((x, i) => `<div class="small mono">Pli ${i + 1} : ${x.cards.map(([q, c]) => `${q} ${rk(c[1])}${SYM[c[0]]}`).join(' · ')} → ${SEATNAME[x.win]}</div>`).join('')}</div>
  <div class="acts">${PG.ecole ? '' : PG.open ? '<button class="btn" data-pgo="again">Rejouer cette donne ›</button>' : '<button class="btn" data-pgo="new">Une autre donne ›</button>'}<button class="btn sec" data-chap="${def ? 'flanc' : 'jeu'}">Fiche : ${def ? 'la défense' : 'le plan du déclarant'}</button><button class="btn sec" data-nav="${PG.back}">Retour</button></div></div>`);
}
app.addEventListener('click', e => {

  4: { t: 'Faire tomber les atouts', tk: 'Purger les atouts' },
  5: { t: 'Affranchir une couleur longue', tk: 'Affranchir une longueur' },
  6: { t: 'Couper au mort', tk: 'Couper au mort' },
  7: { t: 'L\'impasse simple', tk: 'Impasse à la Dame' },
  8: { t: 'Jouer vers le Roi', tk: 'Jouer vers le Roi' },

const ecMax = () => (tone() === 'enfant' ? 7 : tone() === 'ado' ? 9 : 10);

function ecState(m) { ST.ecole = ST.ecole || {}; return ST.ecole[m] || (ST.ecole[m] = { played: [], made: 0, tries: 0 }); }
const SN = s => ({ S: 'pique', H: 'cœur', D: 'carreau', C: 'trèfle' })[s];
